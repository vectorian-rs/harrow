name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harrow-core/fuzz
            harrow-middleware/fuzz
            harrow-codec-h1/fuzz
      # Same as `mise run fuzz:check`: type-check every fuzz target so a
      # harness that no longer compiles fails CI, not the next campaign.
      # (Runtime harness bugs still need an actual fuzz run.)
      - run: cargo check --manifest-path harrow-core/fuzz/Cargo.toml
      - run: cargo check --manifest-path harrow-middleware/fuzz/Cargo.toml
      - run: cargo check --manifest-path harrow-codec-h1/fuzz/Cargo.toml
